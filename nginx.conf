# The canonical site. First block for `listen 80`, so it is also the default
# server: kamal-proxy healthchecks the container by IP, and that Host matches
# no server_name below.
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Relative Location headers. TLS is terminated by kamal-proxy in front of
    # this container, so nginx believes it is serving plain http on port 80 —
    # an absolute redirect would send visitors to http://siwe.xyz and downgrade
    # the scheme. Relative ones let the client keep scheme, host and port.
    absolute_redirect off;

    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_types
        text/css
        text/markdown
        text/plain
        text/xml
        application/javascript
        application/json
        application/rss+xml
        application/xml
        image/svg+xml;

    error_page 404 /404.html;

    # Fingerprinted build output. Safe to cache forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Fonts are not fingerprinted but they do not change either. A year, and
    # rename the file if one ever does.
    location /fonts/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location = /feed.rss {
        add_header Cache-Control "public, max-age=600";
        try_files $uri =404;
    }

    location = /sitemap.xml {
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    location = /llms.txt {
        types { }
        default_type text/plain;
        charset utf-8;
        add_header Cache-Control "public, max-age=600";
        try_files $uri =404;
    }

    # ---------------------------------------------------------------- moved

    # The documentation used to be its own site at docs.siwe.xyz, served from
    # the root. Keep the old apex-host paths working too; the retired-host block
    # below applies the same mappings while changing hosts in one hop.
    #
    # Regex rather than prefix locations, so that the rest of the path survives:
    # a prefix `location /quickstart` would send /quickstart/frontend to
    # /docs/quickstart/ and lose the page they asked for.
    #
    # Split the index and leaf cases so directory indexes retain their trailing
    # slash while leaf pages use VitePress's extensionless canonical URL.
    location ~ ^/(quickstart|libraries|integrations|oidc-provider)/?$ {
        return 301 /docs/$1/;
    }

    # These retired pages no longer have a one-to-one replacement. Send them to
    # the closest useful current index instead of leaving a redirecting 404.
    location ~ ^/quickstart/retrieve-onchain-data/?$ {
        return 301 /docs/quickstart/;
    }

    location ~ ^/integrations/auth0/?$ {
        return 301 /docs/integrations/;
    }

    location ~ ^/(quickstart|libraries|integrations|oidc-provider)/(.+)/$ {
        return 301 /docs/$1/$2;
    }

    location ~ ^/(quickstart|libraries|integrations|oidc-provider)/(.+)$ {
        return 301 /docs/$1/$2;
    }

    location = /security-considerations {
        return 301 /docs/security-considerations;
    }

    # The validator became a tool rather than a docs page, and its companion
    # troubleshooting page was folded into the tool.
    location ~ ^/validator(/.*)?$ {
        return 301 /tools/validator;
    }

    location = /media-kit { return 301 /brand; }

    # A previous redirect could already have exposed the removed page or a
    # trailing-slash leaf URL on the canonical host. Normalize those too.
    location ~ ^/docs/quickstart/retrieve-onchain-data/?$ {
        return 301 /docs/quickstart/;
    }

    location ~ ^(/docs/(quickstart|libraries|integrations|oidc-provider)/.+)/$ {
        return 301 $1;
    }

    # Keep this after the legacy regex locations so old documentation paths
    # still redirect before their Markdown representations are served.
    location ~ \.md$ {
        types { }
        default_type text/markdown;
        charset utf-8;
        charset_types text/markdown;
        add_header Cache-Control "public, max-age=600";
        add_header Link '</llms.txt>; rel="describedby"; type="text/plain"';
        try_files $uri =404;
    }

    # cleanUrls is on, so a request for /docs/quickstart resolves to
    # /docs/quickstart.html and a directory resolves to its index.
    location / {
        try_files $uri $uri.html $uri/ =404;
    }
}

# ------------------------------------------------------------------ retired

# docs.siwe.xyz. The Docusaurus site that used to answer here is gone; its
# pages now live under /docs/ on the canonical host. These rules change host
# and path together so every known legacy route reaches its replacement in one
# hop. Absolute redirects avoid a scheme downgrade behind TLS termination.
server {
    listen 80;
    server_name docs.siwe.xyz;

    # The docs root was the documentation home page, not the site home page.
    location = / {
        return 301 https://siwe.xyz/docs/;
    }

    location ~ ^/quickstart/retrieve-onchain-data/?$ {
        return 301 https://siwe.xyz/docs/quickstart/;
    }

    location ~ ^/integrations/auth0/?$ {
        return 301 https://siwe.xyz/docs/integrations/;
    }

    location ~ ^/(quickstart|libraries|integrations|oidc-provider)/?$ {
        return 301 https://siwe.xyz/docs/$1/;
    }

    location ~ ^/(quickstart|libraries|integrations|oidc-provider)/(.+)/$ {
        return 301 https://siwe.xyz/docs/$1/$2;
    }

    location ~ ^/(quickstart|libraries|integrations|oidc-provider)/(.+)$ {
        return 301 https://siwe.xyz/docs/$1/$2;
    }

    location = /security-considerations {
        return 301 https://siwe.xyz/docs/security-considerations;
    }

    location ~ ^/validator(/.*)?$ {
        return 301 https://siwe.xyz/tools/validator;
    }

    location = /media-kit {
        return 301 https://siwe.xyz/brand;
    }

    location / {
        return 301 https://siwe.xyz$request_uri;
    }
}

# www.siwe.xyz and next.siwe.xyz always collapse to the apex host. The explicit
# www redirect reinforces the apex canonical URL emitted by VitePress.
server {
    listen 80;
    server_name www.siwe.xyz next.siwe.xyz;

    return 301 https://siwe.xyz$request_uri;
}

# The retired OIDC demo should lead visitors to the current provider docs, not
# leave a dead subdomain in the index.
server {
    listen 80;
    server_name oidc-demo.siwe.xyz;

    return 301 https://siwe.xyz/docs/oidc-provider/;
}
