service: siwe-site
image: <%= ENV["DOCKER_REGISTRY_USERNAME"] %>/siwe-site

servers:
  web:
    hosts:
      - <%= ENV["DEPLOY_HOST"] %>

proxy:
  ssl: true
  hosts:
    # APP_HOST is the canonical name the site is built for. The rest are
    # retired hostnames this service also answers on, only so that nginx can
    # redirect them — see the server blocks at the bottom of nginx.conf.
    - <%= ENV["APP_HOST"] %>
    - www.siwe.xyz
    - docs.siwe.xyz
    - next.siwe.xyz
    - oidc-demo.siwe.xyz
  app_port: 80
  healthcheck:
    path: /
    interval: 5
    timeout: 30

registry:
  username: <%= ENV["DOCKER_REGISTRY_USERNAME"] %>
  password:
    - KAMAL_REGISTRY_PASSWORD

builder:
  arch: amd64
  args:
    APP_HOST: <%= ENV["APP_HOST"] %>
    SIWE_API_URL: https://<%= ENV.fetch("API_HOST", "api.siwe.xyz") %>

ssh:
  user: root
